name: devenv
commands:
  nvim:
    args: 
      - nvim
    env_file:
      - path: .devenv.env
        required: false
    tty: true
  shell:
    args: 
      - $HOME/.nix-profile/bin/zsh
      - -l
    env_file:
      - path: .devenv.env
        required: false
    stop_signal: SIGHUP
    tty: true
  claude:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - --env CRABSWARM_CLAUDE_CHANNEL --env FAKECHAT_PORT
      - -lc
      - claude --channels plugin:fakechat@claude-plugins-official
    env:
      - CRABSWARM_CLAUDE_CHANNEL=1
      - FAKECHAT_PORT=9943
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    scale: 3
    tty: true
  codex-server:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - >-
        --network ${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-codex
        --mount type=volume,src=${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-codex,dst=/tmp/codex-daemon-0
        --env CRABSWARM_CODEX_APP_SERVER
      - -lc
      - |
        crabswarm util supervised --name crabswarm-mcp-shared \
          --poll http://127.0.0.1:47300/mcp --poll-status 400 --poll-interval 200ms --poll-retries 100 \
          -- crabswarm mcp --transport http --listen 127.0.0.1:47300 \
          && rm -f -- "$${CRABSWARM_CODEX_APP_SERVER#unix://}" \
          && exec codex app-server --listen "$$CRABSWARM_CODEX_APP_SERVER"
    env:
      - CRABSWARM_CODEX_APP_SERVER=unix:///tmp/codex-daemon-0/app-server.sock
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    hooks:
      - name: network
        resource: network
        start_pre:
          - sh
          - -c
          - |
            set -eu
            net=${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-codex
            podman network exists "$$net" || podman network create "$$net" >/dev/null
            echo "$$net"
        stop_post:
          args:
            - sh
            - -c
            - |
              set -eu
              net=$$CMDMAN_COMPOSE_RESOURCE_VALUE
              if [ -n "$$net" ] && podman network exists "$$net"; then
                podman network rm "$$net" >/dev/null
              fi
          on_error: continue
      - name: volume
        resource: volume
        start_pre:
          - sh
          - -c
          - |
            set -eu
            vol=${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-codex
            # codex creates its daemon directory with mode 0700.
            podman volume exists "$$vol" \
              || podman volume create --opt type=tmpfs --opt device=tmpfs --opt o=size=16m,mode=0700 "$$vol" >/dev/null
            echo "$$vol"
        stop_post:
          args:
            - sh
            - -c
            - |
              set -eu
              vol=$$CMDMAN_COMPOSE_RESOURCE_VALUE
              if [ -n "$$vol" ] && podman volume exists "$$vol"; then
                podman volume rm "$$vol" >/dev/null
              fi
          on_error: continue
    tty: true
  codex:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - >-
        --network ${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-codex
        --mount type=volume,src=${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-codex,dst=/tmp/codex-daemon-0
        --env CRABSWARM_CODEX_APP_SERVER
      - -lc
      - crabswarm mcp codex-proxy -- codex --remote "$$CRABSWARM_CODEX_APP_SERVER"
    env:
      - CRABSWARM_CODEX_APP_SERVER=unix:///tmp/codex-daemon-0/app-server.sock
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    after:
      codex-server:
        condition: running
    scale: 3
    tty: true
  opencode-server:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - >-
        --network ${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-opencode
        --network-alias opencode-server
      - -lc
      - |
        crabswarm util supervised --name crabswarm-mcp-shared \
          --poll http://127.0.0.1:47300/mcp --poll-status 400 --poll-interval 200ms --poll-retries 100 \
          -- crabswarm mcp --transport http --listen 0.0.0.0:47300 \
          && exec opencode serve --hostname 0.0.0.0 --port 4096
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    hooks:
      - name: network
        resource: network
        start_pre:
          - sh
          - -c
          - |
            set -eu
            net=${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-opencode
            podman network exists "$$net" || podman network create "$$net" >/dev/null
            echo "$$net"
        stop_post:
          args:
            - sh
            - -c
            - |
              set -eu
              net=$$CMDMAN_COMPOSE_RESOURCE_VALUE
              if [ -n "$$net" ] && podman network exists "$$net"; then
                podman network rm "$$net" >/dev/null
              fi
          on_error: continue
    tty: true
  opencode:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - --network ${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-opencode --env CRABSWARM_OPENCODE_SERVER
      - -lc
      - |
        crabswarm util poll wait "$$CRABSWARM_OPENCODE_SERVER/global/health" --interval 200ms --retries 500 \
          && opencode attach "$$CRABSWARM_OPENCODE_SERVER"
    env:
      - CRABSWARM_OPENCODE_SERVER=http://opencode-server:4096
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    after:
      opencode-server:
        condition: running
    scale: 3
    tty: true
mux:
  layouts:
    - name: default
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - dir: v
            splits: [50%, 50%]
            panes:
              - command: claude
                focus: true
              - codex
    - name: claude-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: claude
            focus: true
    - name: codex-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: codex
            focus: true
    - name: opencode-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: opencode
            focus: true
    - name: claude-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: claude
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: codex-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: codex 
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: opencode-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: opencode
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: claude-two-right
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - dir: v
            splits: [50%, 50%]
            panes:
              - command: claude
                scale: 1
                focus: true
              - command: claude
                scale: 2
    - name: claude-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: claude
            scale: 1
            focus: true
          - command: claude
            scale: 2
          - command: claude
            scale: 3
    - name: codex-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: codex
            scale: 1
            focus: true
          - command: codex
            scale: 2
          - command: codex
            scale: 3
    - name: opencode-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: opencode
            scale: 1
            focus: true
          - command: opencode
            scale: 2
          - command: opencode
            scale: 3
    - name: all-agents
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 1
                focus: true
              - command: codex
                scale: 1
              - command: opencode
                scale: 1
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 2
              - command: codex
                scale: 2
              - command: opencode
                scale: 2
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 3
              - command: codex
                scale: 3
              - command: opencode
                scale: 3
