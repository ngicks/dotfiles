name: devenv
commands:
  nvim:
    args: 
      - nvim
    env_file:
      - path: .devenv.env
        required: false
    tty: true
  shell:
    args: 
      - $HOME/.nix-profile/bin/zsh
      - -l
    env_file:
      - path: .devenv.env
        required: false
    stop_signal: SIGHUP
    tty: true
  claude:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - --env CRABSWARM_CLAUDE_CHANNEL --env FAKECHAT_PORT
      - -lc
      - claude --channels plugin:fakechat@claude-plugins-official
    env:
      - CRABSWARM_CLAUDE_CHANNEL=1
      - FAKECHAT_PORT=9943
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    scale: 3
    tty: true
  # codex and opencode are split into a server and a TUI client. Both halves
  # run in the same container: each replica is its own podman container with a
  # private network namespace and a fresh /tmp, so a server started elsewhere
  # would be unreachable. That isolation also makes fixed socket paths and ports
  # safe across replicas. The scripts below are one `-lc` argument; compose
  # interpolates `$var` and `${var}` while loading the file, so shell variables
  # are written as `$$var` to reach zsh intact.
  codex:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - --env CRABSWARM_CODEX_APP_SERVER
      - -lc
      # Bound readiness checks so a failed server cannot leave the client waiting.
      - |
        cmdman run --inject-env=false --tty --rm --name codex-server -- codex app-server --listen "$$CRABSWARM_CODEX_APP_SERVER" \
          && crabswarm util poll wait "$$CRABSWARM_CODEX_APP_SERVER" --interval 200ms --retries 500 \
          && codex --remote "$$CRABSWARM_CODEX_APP_SERVER"
    env:
      - CRABSWARM_CODEX_APP_SERVER=unix:///tmp/codex-app-server.sock
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    scale: 3
    tty: true
  opencode:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - --env CRABSWARM_OPENCODE_SERVER
      - -lc
      - |
        cmdman run --inject-env=false --tty --rm --name opencode-server -- opencode serve --port 4096 \
          && crabswarm util poll wait "$$CRABSWARM_OPENCODE_SERVER/global/health" --interval 200ms --retries 500 \
          && opencode attach "$$CRABSWARM_OPENCODE_SERVER"
    env:
      - CRABSWARM_OPENCODE_SERVER=http://127.0.0.1:4096
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    scale: 3
    tty: true
mux:
  layouts:
    - name: default
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - dir: v
            splits: [50%, 50%]
            panes:
              - command: claude
                focus: true
              - codex
    - name: claude-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: claude
            focus: true
    - name: codex-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: codex
            focus: true
    - name: opencode-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: opencode
            focus: true
    - name: claude-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: claude
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: codex-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: codex 
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: opencode-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: opencode
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: claude-two-right
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - dir: v
            splits: [50%, 50%]
            panes:
              - command: claude
                scale: 1
                focus: true
              - command: claude
                scale: 2
    - name: claude-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: claude
            scale: 1
            focus: true
          - command: claude
            scale: 2
          - command: claude
            scale: 3
    - name: codex-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: codex
            scale: 1
            focus: true
          - command: codex
            scale: 2
          - command: codex
            scale: 3
    - name: opencode-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: opencode
            scale: 1
            focus: true
          - command: opencode
            scale: 2
          - command: opencode
            scale: 3
    - name: all-agents
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 1
                focus: true
              - command: codex
                scale: 1
              - command: opencode
                scale: 1
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 2
              - command: codex
                scale: 2
              - command: opencode
                scale: 2
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 3
              - command: codex
                scale: 3
              - command: opencode
                scale: 3
