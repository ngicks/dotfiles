name: devenv
env:
  - CLAUDE_NETWORK=${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-claude
  - CODEX_NETWORK=${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-codex
  - CODEX_VOLUME=${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-codex
  - OPENCODE_NETWORK=${CMDMAN_COMPOSE_WORK_DIR_HASH}-${CMDMAN_COMPOSE_PROJECT}-opencode
  - CRABSWARM_CLAUDE_MCP_SERVER=http://claude-server:47300/mcp
  - CRABSWARM_CODEX_APP_SERVER=unix:///tmp/codex-daemon-0/app-server.sock
  - CRABSWARM_OPENCODE_SERVER=http://opencode-server:4096
env_file:
  - path: .devenv.env
    required: false
commands:
  nvim:
    args:
      - nvim
    tty: true
  shell:
    args:
      - $HOME/.nix-profile/bin/zsh
      - -l
    stop_signal: SIGHUP
    tty: true
  claude-server:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - >-
        --name $${CMDMAN_CMD_NAME}
        --replace
        --network ${CLAUDE_NETWORK}
        --network-alias claude-server
      - -lc
      - exec crabswarm mcp --transport http --listen 0.0.0.0:47300
    env:
      - DEVENV_NETWORK=${CLAUDE_NETWORK}
    hooks:
      - &network_hook
        name: network
        resource: network
        start_pre:
          - sh
          - -c
          - |
            set -eu
            net=${DEVENV_NETWORK}
            podman network exists "$$net" || podman network create "$$net" >/dev/null
            echo "$$net"
        stop_post:
          args:
            - sh
            - -c
            - |
              set -eu
              net=$$CMDMAN_COMPOSE_RESOURCE_VALUE
              if [ -n "$$net" ] && podman network exists "$$net"; then
                podman network rm "$$net" >/dev/null
              fi
          on_error: continue
    stop: &stop_container
      - sh
      - -c
      - podman stop --ignore --time 5 "$$CMDMAN_CMD_NAME" >/dev/null
    tty: true
  claude:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - --name $${CMDMAN_CMD_NAME} --replace --network ${CLAUDE_NETWORK} --env CRABSWARM_CLAUDE_MCP_SERVER
      - -lc
      - |
        crabswarm util poll wait "$$CRABSWARM_CLAUDE_MCP_SERVER" --status 400 --interval 500ms --retries 500 \
          && exec claude
    env_file: &agent_env_file
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    after:
      claude-server:
        condition: running
    scale: 3
    stop: *stop_container
    tty: true
  codex-server:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - &codex_run_opts >-
        --name $${CMDMAN_CMD_NAME}
        --replace
        --network ${CODEX_NETWORK}
        --mount type=volume,src=${CODEX_VOLUME},dst=/tmp/codex-daemon-0
        --env CRABSWARM_CODEX_APP_SERVER
      - -lc
      - |
        crabswarm util supervised --name crabswarm-mcp-shared \
          --poll http://127.0.0.1:47300/mcp --poll-status 400 --poll-interval 500ms --poll-retries 500 \
          -- crabswarm mcp --transport http --listen 127.0.0.1:47300 \
          && rm -f -- "$${CRABSWARM_CODEX_APP_SERVER#unix://}" \
          && exec codex app-server --listen "$$CRABSWARM_CODEX_APP_SERVER"
    env:
      - DEVENV_NETWORK=${CODEX_NETWORK}
    env_file: *agent_env_file
    hooks:
      - *network_hook
      - name: volume
        resource: volume
        start_pre:
          - sh
          - -c
          - |
            set -eu
            vol=${CODEX_VOLUME}
            # codex creates its daemon directory with mode 0700.
            podman volume exists "$$vol" \
              || podman volume create --opt type=tmpfs --opt device=tmpfs --opt o=size=16m,mode=0700 "$$vol" >/dev/null
            echo "$$vol"
        stop_post:
          args:
            - sh
            - -c
            - |
              set -eu
              vol=$$CMDMAN_COMPOSE_RESOURCE_VALUE
              if [ -n "$$vol" ] && podman volume exists "$$vol"; then
                podman volume rm "$$vol" >/dev/null
              fi
          on_error: continue
    stop: *stop_container
    tty: true
  codex:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - *codex_run_opts
      - -lc
      - crabswarm mcp codex-proxy -- codex --remote "$$CRABSWARM_CODEX_APP_SERVER"
    env_file: *agent_env_file
    after:
      codex-server:
        condition: running
    scale: 3
    stop: *stop_container
    tty: true
  opencode-server:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - >-
        --name $${CMDMAN_CMD_NAME}
        --replace
        --network ${OPENCODE_NETWORK}
        --network-alias opencode-server
      - -lc
      - |
        crabswarm util supervised --name crabswarm-mcp-shared \
          --poll http://127.0.0.1:47300/mcp --poll-status 400 --poll-interval 500ms --poll-retries 500 \
          -- crabswarm mcp --transport http --listen 0.0.0.0:47300 \
          && exec opencode serve --hostname 0.0.0.0 --port 4096
    env:
      - DEVENV_NETWORK=${OPENCODE_NETWORK}
    env_file: *agent_env_file
    hooks:
      - *network_hook
    stop: *stop_container
    tty: true
  opencode:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - >- 
        --name $${CMDMAN_CMD_NAME}
        --replace
        --network ${OPENCODE_NETWORK}
        --env CRABSWARM_OPENCODE_SERVER
      - -lc
      - |
        crabswarm util poll wait "$$CRABSWARM_OPENCODE_SERVER/global/health" --interval 500ms --retries 500 \
          && opencode attach "$$CRABSWARM_OPENCODE_SERVER"
    env_file: *agent_env_file
    after:
      opencode-server:
        condition: running
    scale: 3
    stop: *stop_container
    tty: true
mux:
  layouts:
    - name: default
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - dir: v
            splits: [50%, 50%]
            panes:
              - command: claude
                focus: true
              - codex
    - name: claude-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: claude
            focus: true
    - name: codex-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: codex
            focus: true
    - name: opencode-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: opencode
            focus: true
    - name: claude-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: claude
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: codex-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: codex
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: opencode-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: opencode
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: claude-two-right
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - dir: v
            splits: [50%, 50%]
            panes:
              - command: claude
                scale: 1
                focus: true
              - command: claude
                scale: 2
    - name: claude-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: claude
            scale: 1
            focus: true
          - command: claude
            scale: 2
          - command: claude
            scale: 3
    - name: codex-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: codex
            scale: 1
            focus: true
          - command: codex
            scale: 2
          - command: codex
            scale: 3
    - name: opencode-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: opencode
            scale: 1
            focus: true
          - command: opencode
            scale: 2
          - command: opencode
            scale: 3
    - name: all-agents
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 1
                focus: true
              - command: codex
                scale: 1
              - command: opencode
                scale: 1
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 2
              - command: codex
                scale: 2
              - command: opencode
                scale: 2
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 3
              - command: codex
                scale: 3
              - command: opencode
                scale: 3
