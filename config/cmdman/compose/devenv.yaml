name: devenv
commands:
  nvim:
    args: 
      - nvim
    env_file:
      - path: .devenv.env
        required: false
    tty: true
  shell:
    args: 
      - $HOME/.nix-profile/bin/zsh
      - -l
    env_file:
      - path: .devenv.env
        required: false
    stop_signal: SIGHUP
    tty: true
  # Every agent is split into a server and a TUI client. Both halves run in the
  # same container: each replica is its own podman container with a private
  # network namespace and a fresh /tmp, so a server started elsewhere would be
  # unreachable. That isolation also makes fixed socket paths and ports safe
  # across replicas. The scripts below are one `-lc` argument; compose
  # interpolates `$var` and `${var}` while loading the file, so shell variables
  # are written as `$$var` to reach zsh intact.
  claude:
    env:
      - CRABSWARM_CLAUDE_CHANNEL=1
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - --env CRABSWARM_CLAUDE_CHANNEL
      - -lc
      # `claude --bg` returns once its own supervisor owns the session, so no
      # cmdman supervision is needed. It prints
      # "backgrounded · <id> · <name>" (possibly after a "Starting background
      # service" line); the id is the third field.
      - |
        id=$(claude --bg 2>&1 | tee /dev/stderr | awk '/^backgrounded/{print $3}') \
          && [ -n "$$id" ] \
          && claude attach "$$id"
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    scale: 3
    tty: true
  codex:
    env:
      - CRABSWARM_CODEX_APP_SERVER=unix:///tmp/codex-app-server.sock
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - --env CRABSWARM_CODEX_APP_SERVER
      - -lc
      # The readiness poll is bounded so a server that fails to start surfaces
      # as the client's own connect error instead of a silent hang.
      - |
        sock=$${CRABSWARM_CODEX_APP_SERVER#unix://}
        cmdman run --tty --rm --name codex-server -- codex app-server --listen "$$CRABSWARM_CODEX_APP_SERVER" \
          && for i in {1..50}; do [ -S "$$sock" ] && break; sleep 0.2; done \
          && codex --remote "$$CRABSWARM_CODEX_APP_SERVER"
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    scale: 3
    tty: true
  opencode:
    args:
      - $HOME/.dotfiles/devenv_run.sh
      - ""
      - -lc
      # --max-time keeps the poll from blocking on a half-started server.
      - |
        url=http://127.0.0.1:4096
        cmdman run --tty --rm --name opencode-server -- opencode serve --port 4096 \
          && for i in {1..50}; do curl -s -o /dev/null --max-time 2 "$$url/global/health" && break; sleep 0.2; done \
          && opencode attach "$$url"
    env_file:
      - path: .devenv.env
        required: false
      - path: .kvm.env
        required: false
      - path: .gpu.env
        required: false
    scale: 3
    tty: true
mux:
  layouts:
    - name: default
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - dir: v
            splits: [50%, 50%]
            panes:
              - command: claude
                focus: true
              - codex
    - name: claude-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: claude
            focus: true
    - name: codex-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: codex
            focus: true
    - name: opencode-focused
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - command: opencode
            focus: true
    - name: claude-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: claude
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: codex-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: codex 
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: opencode-focused-portrait
      root:
        dir: v
        splits: [50%, 50%]
        panes:
          - command: opencode
            focus: true
          - dir: h
            splits: [1, 20%]
            panes:
              - nvim
              - shell
    - name: claude-two-right
      root:
        dir: h
        splits: [50%, 50%]
        panes:
          - dir: v
            splits: [1, 20%]
            panes:
              - nvim
              - shell
          - dir: v
            splits: [50%, 50%]
            panes:
              - command: claude
                scale: 1
                focus: true
              - command: claude
                scale: 2
    - name: claude-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: claude
            scale: 1
            focus: true
          - command: claude
            scale: 2
          - command: claude
            scale: 3
    - name: codex-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: codex
            scale: 1
            focus: true
          - command: codex
            scale: 2
          - command: codex
            scale: 3
    - name: opencode-3col
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - command: opencode
            scale: 1
            focus: true
          - command: opencode
            scale: 2
          - command: opencode
            scale: 3
    - name: all-agents
      root:
        dir: h
        splits: [1, 1, 1]
        panes:
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 1
                focus: true
              - command: codex
                scale: 1
              - command: opencode
                scale: 1
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 2
              - command: codex
                scale: 2
              - command: opencode
                scale: 2
          - dir: v
            splits: [1, 1, 1]
            panes:
              - command: claude
                scale: 3
              - command: codex
                scale: 3
              - command: opencode
                scale: 3
